name: ✨ Enhancement
description: Suggest an improvement for the mirror repository
title: "✨ <title>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        **Thank you for suggesting an improvement!**

        ⚠
        Verify first that your idea is not [already suggested on GitHub](https://github.com/cda-tum/alglib-mirror/search?q=is%3Aissue&type=issues).

  - type: dropdown
    attributes:
      label: Enhancement Type
      description: What type of enhancement are you suggesting?
      options:
        - Documentation improvement
        - Add new ALGLIB edition (C#, Python, Java, etc.)
        - Add checksums/verification
        - Automation/CI improvements
        - Repository organization
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: What problem does this enhancement solve?
      description: >-
        What are you trying to do that would be improved by this enhancement?
      placeholder: >-
        I'm trying to X and this enhancement would make it easier because Y.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the enhancement you'd like
      description: >
        Clear and concise description of what you want to happen.
      placeholder: >-
        When I do X, I want to achieve Y.
        
        For example:
        - Add SHA-256 checksums to each release for verification
        - Include C# editions in addition to C++ editions
        - Add a badge showing total download count
        - Provide a JSON API listing all available versions
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: >
        Have you considered any alternative solutions or workarounds?
      placeholder: >-
        For example:
        - I could manually verify files, but automated checksums would be better
        - I could use the official site, but it's unreliable in CI

  - type: textarea
    attributes:
      label: Additional context
      description: >
        Any other context, screenshots, or examples that would help explain the enhancement.
